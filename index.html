<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>King Fahad Junior School - Complete SMS | Receipts & Shared Storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: 
                linear-gradient(135deg, rgba(46, 125, 50, 0.7) 0%, rgba(27, 94, 32, 0.7) 100%),
                url('wallpaper 2 (2).jpg') center/cover fixed;
            min-height: 100vh;
            padding: 20px;
        }

        /* Green & White Theme */
        :root {
            --primary-green: #2e7d32;
            --primary-dark: #1b5e20;
            --light-green: #81c784;
            --accent-green: #4caf50;
            --white: #ffffff;
            --gray-bg: #f8faf8;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
            --border-radius: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 2rem;
        }

        .card-login {
            max-width: 450px;
            margin: 80px auto;
        }

        h1, h2, h3 {
            color: var(--primary-green);
            font-weight: 600;
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            font-size: 1.8rem;
            letter-spacing: -0.3px;
        }

        .logo .sub {
            color: #5a6b5a;
            font-size: 0.9rem;
        }

        input, select, button {
            width: 100%;
            padding: 12px 18px;
            margin: 8px 0;
            border: 2px solid #e0e7e0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--white);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        button {
            background: var(--primary-green);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--accent-green);
        }

        .btn-danger {
            background: #d32f2f;
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
        }

        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            padding: 1rem 2rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary-green);
        }

        .nav-links {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-link {
            background: none;
            border: none;
            color: var(--primary-green);
            font-weight: 500;
            cursor: pointer;
            width: auto;
            padding: 8px 20px;
            margin: 0;
            border-radius: 40px;
        }

        .nav-link:hover {
            background: #e8f5e9;
            transform: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e8ece8;
        }

        th {
            background: var(--primary-green);
            color: white;
            font-weight: 500;
        }

        tr:hover {
            background: #f5f9f5;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            margin: 1.5rem 0;
        }

        .stat-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
            border-top: 5px solid var(--primary-green);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-danger {
            background: #ffebee;
            color: #c62828;
        }

        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Receipt Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            position: relative;
            box-shadow: var(--shadow-md);
        }

        .receipt {
            font-family: monospace;
            line-height: 1.6;
        }

        .receipt h3 {
            text-align: center;
            color: var(--primary-green);
        }

        .receipt hr {
            margin: 15px 0;
            border: 1px dashed #ccc;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .print-receipt {
            background: var(--primary-green);
            margin-top: 20px;
        }

        @media print {
            .modal-content {
                box-shadow: none;
                padding: 0;
                margin: 0;
                width: 100%;
            }
            .close-btn, .print-receipt, .modal button:not(.print-receipt) {
                display: none;
            }
            .modal {
                display: block;
                position: relative;
                background: white;
            }
        }

        @media (max-width: 768px) {
            .card, .card-login {
                padding: 1.2rem;
            }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
            }
            th, td {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ==================== DATABASE (Shared Storage using localStorage) ====================
        // All admin logins on the same device/browser share this storage.
        // For multi-device deployment, replace with a real backend (e.g., Node.js + MongoDB).
        function initDatabase() {
            if (!localStorage.getItem('school_db_v2')) {
                const defaultData = {
                    users: [
                        { id: 1, username: 'admin', password: 'admin123', full_name: 'Administrator', phone: '0000000000', role: 'admin', class: null },
                        { id: 2, username: 'student1', password: 'student123', full_name: 'Ahmed Hassan', phone: '0550000001', role: 'student', class: 'Grade 5A' },
                        { id: 3, username: 'student2', password: 'student123', full_name: 'Fatima Ibrahim', phone: '0550000002', role: 'student', class: 'Grade 6B' },
                        { id: 4, username: 'student3', password: 'student123', full_name: 'Omar Khalid', phone: '0550000003', role: 'student', class: 'Grade 4C' }
                    ],
                    students: [
                        { id: 2, full_name: 'Ahmed Hassan', phone: '0550000001', class: 'Grade 5A', username: 'student1', password: 'student123', role: 'student' },
                        { id: 3, full_name: 'Fatima Ibrahim', phone: '0550000002', class: 'Grade 6B', username: 'student2', password: 'student123', role: 'student' },
                        { id: 4, full_name: 'Omar Khalid', phone: '0550000003', class: 'Grade 4C', username: 'student3', password: 'student123', role: 'student' }
                    ],
                    fees: [
                        { id: 1, student_id: 2, student_name: 'Ahmed Hassan', description: 'Term 1 Fees 2025', total_due: 2500, paid_amount: 1000, due_date: '2025-04-15' },
                        { id: 2, student_id: 3, student_name: 'Fatima Ibrahim', description: 'Term 1 Fees 2025', total_due: 2500, paid_amount: 2500, due_date: '2025-04-15' },
                        { id: 3, student_id: 4, student_name: 'Omar Khalid', description: 'Term 1 Fees 2025', total_due: 2500, paid_amount: 500, due_date: '2025-04-15' }
                    ],
                    payments: [],  // Payment history for receipts
                    nextUserId: 5,
                    nextFeeId: 4,
                    nextPaymentId: 1
                };
                localStorage.setItem('school_db_v2', JSON.stringify(defaultData));
            }
        }

        function getDB() {
            return JSON.parse(localStorage.getItem('school_db_v2'));
        }

        function saveDB(db) {
            localStorage.setItem('school_db_v2', JSON.stringify(db));
        }

        // Helper to send phone notification (simulated)
        function sendPhoneNotification(to, subject, message) {
            console.log(`📲 SMS TO: ${to}\nSubject: ${subject}\nMessage: ${message}`);
            alert(`📲 Notification sent to ${to}\nSubject: ${subject}\n\n${message}`);
            return true;
        }

        // Check and notify due fees
        function checkAndNotifyDueFees() {
            const db = getDB();
            const notificationsSent = [];
            for (const fee of db.fees) {
                const balance = fee.total_due - fee.paid_amount;
                if (balance > 0) {
                    const student = db.students.find(s => s.id === fee.student_id);
                    if (student && student.phone) {
                        const subject = `⚠️ Fee Due Reminder - King Fahad Junior School`;
                        const message = `Dear ${student.full_name},\n\nYour outstanding balance for "${fee.description}" is UGX ${balance.toFixed(2)}.\nDue Date: ${fee.due_date || 'Immediately'}\nPlease clear your dues to avoid penalties.\n\nRegards,\nKing Fahad Junior School Admin`;
                        sendPhoneNotification(student.phone, subject, message);
                        notificationsSent.push(student.phone);
                    }
                }
            }
            return notificationsSent;
        }

        // Authentication
        function login(username, password) {
            const db = getDB();
            const user = db.users.find(u => u.username === username && u.password === password);
            if (user) {
                const { password: _, ...userWithoutPass } = user;
                return { success: true, user: userWithoutPass };
            }
            return { success: false, error: 'Invalid username or password' };
        }

        // Student CRUD
        function getAllStudents() {
            const db = getDB();
            return db.students;
        }

        function addStudent(studentData) {
            const db = getDB();
            const newId = db.nextUserId;
            const newStudent = {
                id: newId,
                full_name: studentData.full_name,
                phone: studentData.phone,
                class: studentData.class,
                username: studentData.username,
                password: studentData.password,
                role: 'student'
            };
            db.students.push(newStudent);
            db.users.push({ ...newStudent, id: newId });
            db.nextUserId++;
            saveDB(db);
            return newStudent;
        }

        function deleteStudent(studentId) {
            const db = getDB();
            const studentIndex = db.students.findIndex(s => s.id === parseInt(studentId));
            if (studentIndex !== -1) {
                const student = db.students[studentIndex];
                db.students.splice(studentIndex, 1);
                const userIndex = db.users.findIndex(u => u.id === parseInt(studentId));
                if (userIndex !== -1) db.users.splice(userIndex, 1);
                // Delete associated fees and payments
                db.fees = db.fees.filter(f => f.student_id !== parseInt(studentId));
                db.payments = db.payments.filter(p => p.student_id !== parseInt(studentId));
                saveDB(db);
                return true;
            }
            return false;
        }

        // Fee Management
        function getAllFees() {
            const db = getDB();
            return db.fees.map(fee => ({
                ...fee,
                balance: fee.total_due - fee.paid_amount
            }));
        }

        function addFeeRecord(feeData) {
            const db = getDB();
            const student = db.students.find(s => s.id === parseInt(feeData.student_id));
            if (!student) throw new Error('Student not found');
            
            const newFee = {
                id: db.nextFeeId,
                student_id: parseInt(feeData.student_id),
                student_name: student.full_name,
                description: feeData.description || 'School Fees',
                total_due: parseFloat(feeData.total_due),
                paid_amount: 0,
                due_date: feeData.due_date || null
            };
            db.fees.push(newFee);
            db.nextFeeId++;
            saveDB(db);
            
            // Send notification for new fee
            const balance = newFee.total_due;
            if (balance > 0 && student.phone) {
                sendPhoneNotification(student.phone, 'New Fee Assigned', 
                    `Dear ${student.full_name},\n\nA new fee of UGX ${balance} has been assigned: ${newFee.description}\nDue Date: ${newFee.due_date || 'Soon'}\n\nPlease ensure timely payment.\n\nRegards,\nAdmin`);
            }
            return newFee;
        }

        // Payment with receipt generation
        function addPayment(paymentData) {
            const db = getDB();
            const studentId = parseInt(paymentData.student_id);
            const amountPaid = parseFloat(paymentData.amount_paid);
            const paymentDate = paymentData.payment_date || new Date().toISOString().slice(0,10);
            
            // Find unpaid fees
            const unpaidFees = db.fees.filter(f => f.student_id === studentId && (f.total_due - f.paid_amount) > 0);
            if (unpaidFees.length === 0) {
                throw new Error('No outstanding fees for this student');
            }
            
            let remaining = amountPaid;
            const appliedFees = [];
            
            for (let fee of unpaidFees) {
                if (remaining <= 0) break;
                const balance = fee.total_due - fee.paid_amount;
                const paymentToThisFee = Math.min(remaining, balance);
                fee.paid_amount += paymentToThisFee;
                remaining -= paymentToThisFee;
                appliedFees.push({
                    feeId: fee.id,
                    description: fee.description,
                    amount: paymentToThisFee
                });
            }
            
            // Create payment record
            const student = db.students.find(s => s.id === studentId);
            const totalRemaining = db.fees.filter(f => f.student_id === studentId).reduce((sum, f) => sum + (f.total_due - f.paid_amount), 0);
            
            const paymentRecord = {
                id: db.nextPaymentId,
                student_id: studentId,
                student_name: student.full_name,
                amount: amountPaid,
                date: paymentDate,
                remaining_balance: totalRemaining,
                applied_fees: appliedFees
            };
            db.payments.push(paymentRecord);
            db.nextPaymentId++;
            saveDB(db);
            
            // Send notification
            if (student && student.phone) {
                sendPhoneNotification(student.phone, 'Payment Received', 
                    `Dear ${student.full_name},\n\nWe have received your payment of UGX ${amountPaid} on ${paymentDate}.\nRemaining balance: UGX ${totalRemaining.toFixed(2)}\n\nThank you for your prompt payment!\n\nRegards,\nKing Fahad Junior School`);
            }
            
            return { success: true, paymentRecord, remainingBalance: totalRemaining };
        }

        function deleteFeeRecord(feeId) {
            const db = getDB();
            const index = db.fees.findIndex(f => f.id === parseInt(feeId));
            if (index !== -1) {
                db.fees.splice(index, 1);
                saveDB(db);
                return true;
            }
            return false;
        }

        function getStudentFees(studentId) {
            const db = getDB();
            return db.fees.filter(f => f.student_id === parseInt(studentId)).map(f => ({
                ...f,
                balance: f.total_due - f.paid_amount
            }));
        }

        function getAllPayments() {
            const db = getDB();
            return db.payments;
        }

        // ==================== UI RENDERING ====================
        let currentUser = null;

        function showReceiptModal(payment) {
            // Create modal element if not exists
            let modal = document.getElementById('receiptModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'receiptModal';
                modal.className = 'modal';
                document.body.appendChild(modal);
            }
            
            const appliedFeesHtml = payment.applied_fees.map(f => 
                `<tr><td>${f.description}</td><td>UGX ${f.amount.toFixed(2)}</td></tr>`
            ).join('');
            
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close-btn">&times;</span>
                    <div class="receipt">
                        <h3>🏫 KING FAHAD JUNIOR SCHOOL</h3>
                        <p style="text-align:center;">Official Fee Receipt</p>
                        <hr>
                        <p><strong>Receipt No:</strong> KFJS-${payment.id}</p>
                        <p><strong>Date:</strong> ${payment.date}</p>
                        <p><strong>Student:</strong> ${payment.student_name}</p>
                        <p><strong>Student ID:</strong> ${payment.student_id}</p>
                        <hr>
                        <table style="width:100%; margin:10px 0;">
                            <thead><tr><th>Description</th><th>Amount (UGX)</th></tr></thead>
                            <tbody>${appliedFeesHtml}</tbody>
                            <tfoot>
                                <tr><td><strong>Total Paid</strong></td><td><strong>UGX ${payment.amount.toFixed(2)}</strong></td></tr>
                                <tr><td>Remaining Balance</td><td>UGX ${payment.remaining_balance.toFixed(2)}</td></tr>
                            </tfoot>
                        </table>
                        <hr>
                        <p style="text-align:center; font-size:12px;">Thank you for your payment!<br>This is a computer-generated receipt.</p>
                    </div>
                    <button class="print-receipt">🖨️ Print Receipt</button>
                </div>
            `;
            
            modal.style.display = 'flex';
            
            const closeBtn = modal.querySelector('.close-btn');
            closeBtn.onclick = () => { modal.style.display = 'none'; };
            const printBtn = modal.querySelector('.print-receipt');
            printBtn.onclick = () => {
                window.print();
            };
            
            window.onclick = (e) => {
                if (e.target === modal) modal.style.display = 'none';
            };
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="card card-login">
                        <div class="logo">
                            <img src="logo.png" alt="Logo">
                            <h1>KING FAHAD JUNIOR SCHOOL</h1>
                            <div class="sub">Excellence in Education | Online Management System</div>
                        </div>
                        <h2 style="text-align:center; font-size:1.4rem;">Secure Login Portal</h2>
                        <div id="loginError" class="alert alert-error" style="display:none"></div>
                        <input type="text" id="username" placeholder="Username" autocomplete="off">
                        <input type="password" id="password" placeholder="Password">
                        <button id="loginBtn">🔐 Login to Dashboard</button>
                        <p style="text-align:center; font-size:11px; color:#888;">✓ All admin accounts share the same data storage (localStorage). For multi-device use, deploy with a real backend.</p>
                    </div>
                </div>
            `;
            
            document.getElementById('loginBtn').onclick = () => {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('loginError');
                
                const result = login(username, password);
                if (result.success) {
                    currentUser = result.user;
                    if (currentUser.role === 'admin') {
                        renderAdminDashboard();
                    } else {
                        renderStudentDashboard();
                    }
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = result.error;
                }
            };
        }

        function renderAdminDashboard() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="nav-bar">
                        <div class="nav-brand">🏫 KING FAHAD JUNIOR SCHOOL - ADMIN PANEL</div>
                        <div class="nav-links">
                            <button class="nav-link" id="navStudents">👥 Students Management</button>
                            <button class="nav-link" id="navFees">💰 Fee Management</button>
                            <button class="nav-link" id="navPayments">📜 Payment History</button>
                            <button class="nav-link" id="navSearch">🔎 Search Records</button>
                            <button class="nav-link" id="navNotify">📧 Send Due Reminders</button>
                            <button class="nav-link" id="logoutBtn">🚪 Logout</button>
                        </div>
                    </div>
                    <div id="adminContent"></div>
                </div>
            `;
            
            document.getElementById('logoutBtn').onclick = () => {
                currentUser = null;
                renderLogin();
            };
            document.getElementById('navStudents').onclick = () => loadStudentsManagement();
            document.getElementById('navFees').onclick = () => loadFeesManagement();
            document.getElementById('navPayments').onclick = () => loadPaymentHistory();
            document.getElementById('navSearch').onclick = () => loadSearchManagement();
            document.getElementById('navNotify').onclick = () => {
                const sent = checkAndNotifyDueFees();
                alert(`✅ Notifications sent to ${sent.length} student(s) with due balances.`);
                loadFeesManagement();
            };
            
            loadStudentsManagement();
        }
        
        function loadStudentsManagement() {
            const container = document.getElementById('adminContent');
            // Ensure students display in A-Z order by full name
            const students = getAllStudents().slice().sort((a,b) => (a.full_name || '').localeCompare(b.full_name || ''));
            
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
                    <h2>👩‍🎓 Student Records</h2>
                    <button id="addStudentBtn" style="width:auto; padding:10px 28px;">➕ Add New Student</button>
                </div>
                <div style="overflow-x:auto;">
                     <table>
                        <thead>
                            <tr><th>No.</th><th>Full Name</th><th>Phone</th><th>Class</th><th>Username</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            ${students.map((s, index) => `
                                <tr>
                                    <td>${index}</td>
                                    <td><strong>${s.full_name}</strong></td>
                                    <td>${s.phone}</td>
                                    <td>${s.class || 'N/A'}</td>
                                    <td>${s.username}</td>
                                    <td><button class="deleteStudentBtn" data-id="${s.id}" style="background:#d32f2f; width:auto; padding:6px 16px;">Delete</button></td>
                                </tr>
                            `).join('')}
                            ${students.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No students found</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            `;
            
            document.getElementById('addStudentBtn').onclick = () => {
                const full_name = prompt('Full Name:');
                if (!full_name) return;
                const phone = prompt('Phone Number:');
                if (!phone) return;
                const className = prompt('Class (e.g., Grade 5A):') || 'Not Assigned';
                const username = prompt('Username (unique):');
                if (!username) return;
                const password = prompt('Password:') || 'student123';
                
                try {
                    addStudent({ full_name, phone, class: className, username, password });
                    alert('✅ Student added successfully! They can now login.');
                    loadStudentsManagement();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };
            
            document.querySelectorAll('.deleteStudentBtn').forEach(btn => {
                btn.onclick = () => {
                    if (confirm('⚠️ Delete this student? All fee records and payments will be permanently removed.')) {
                        deleteStudent(btn.dataset.id);
                        alert('Student deleted');
                        loadStudentsManagement();
                    }
                };
            });
        }
        
        function loadFeesManagement() {
            const container = document.getElementById('adminContent');
            const students = getAllStudents();
            const fees = getAllFees();
            
            container.innerHTML = `
                <h2>💰 Fee Management System</h2>
                <div class="grid-2">
                    <div class="stat-card">
                        <h3>📝 Assign New Fee</h3>
                        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:8px;">
                            <input id="feeStudentSearchBox" type="text" placeholder="🔍 Search student..." autocomplete="off" style="flex:1; padding:10px; border-radius:12px; border:1px solid #e0e7e0;">
                            <button id="feeClearSearchBtn" class="btn-outline" style="width:auto; padding:8px 12px;">Clear</button>
                        </div>
                        <select id="studentSelect">
                            <option value="">-- Select Student --</option>
                            ${students.map(s => `<option value="${s.id}">${s.full_name} (${s.class})</option>`).join('')}
                        </select>
                        <input type="number" id="feeAmount" placeholder="Total Amount (UGX)" step="0.01">
                        <input type="date" id="dueDate">
                        <input type="text" id="feeDesc" placeholder="Description (e.g., Term 2 Fees)">
                        <button id="createFeeBtn">➕ Create Fee Record</button>
                    </div>
                    <div class="stat-card">
                        <h3>💵 Record Payment (with Receipt)</h3>
                        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:8px;">
                            <input id="paymentStudentSearchBox" type="text" placeholder="🔍 Search student..." autocomplete="off" style="flex:1; padding:10px; border-radius:12px; border:1px solid #e0e7e0;">
                            <button id="paymentClearSearchBtn" class="btn-outline" style="width:auto; padding:8px 12px;">Clear</button>
                        </div>
                        <select id="paymentStudent">
                            <option value="">-- Select Student --</option>
                            ${students.map(s => `<option value="${s.id}">${s.full_name}</option>`).join('')}
                        </select>
                        <input type="number" id="paymentAmount" placeholder="Amount Paid (UGX)" step="0.01">
                        <input type="date" id="paymentDate" value="${new Date().toISOString().slice(0,10)}">
                        <button id="recordPaymentBtn">💸 Record Payment & Generate Receipt</button>
                    </div>
                </div>
                <h3>📋 All Fee Records</h3>
                <!-- Inline fee search: filters visible fee table without leaving page -->
                <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.75rem;">
                    <input id="feeSearchQuery" type="search" placeholder="Search fees by student or description..." autocomplete="off" style="flex:1; padding:10px; border-radius:12px; border:1px solid #e0e7e0;">
                    <button id="feeSearchBtn" style="width:auto; padding:8px 16px;">Search</button>
                    <button id="feeShowAllBtn" class="btn-outline" style="width:auto; padding:8px 12px;">Show All</button>
                </div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr><th>Student</th><th>Description</th><th>Total Due</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="feesTableBody">
                        </tbody>
                    </table>
                </div>
            `;

            // Render rows helper so we can filter on the client
            function renderFeesRows(list) {
                const tbody = document.getElementById('feesTableBody');
                if (!tbody) return;
                if (!list || list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No fee records found</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(f => `
                    <tr>
                        <td><strong>${f.student_name}</strong></td>
                        <td>${f.description}</td>
                        <td>UGX ${f.total_due.toFixed(2)}</td>
                        <td>UGX ${f.paid_amount.toFixed(2)}</td>
                        <td class="${(f.total_due - f.paid_amount) > 0 ? 'badge-danger' : 'badge-success'}" style="font-weight:bold;">UGX ${(f.total_due - f.paid_amount).toFixed(2)}</td>
                        <td>${f.due_date || 'Not set'}</td>
                        <td><button class="deleteFeeBtn" data-id="${f.id}" style="background:#d32f2f; width:auto; padding:5px 12px;">Delete</button></td>
                    </tr>
                `).join('');

                // attach delete handlers
                document.querySelectorAll('.deleteFeeBtn').forEach(btn => {
                    btn.onclick = () => {
                        if (confirm('Delete this fee record?')) {
                            deleteFeeRecord(btn.dataset.id);
                            alert('Fee record deleted');
                            // refresh original fees list from DB
                            const refreshed = getAllFees();
                            // update local copy and UI
                            renderFeesRows(refreshed);
                        }
                    };
                });
            }

            // initial render
            renderFeesRows(fees);

            // Search handlers for "Assign New Fee" student select
            const feeStudentSearchBox = document.getElementById('feeStudentSearchBox');
            const feeClearSearchBtn = document.getElementById('feeClearSearchBtn');
            const studentSelect = document.getElementById('studentSelect');
            const allStudents = students.slice(); // Keep original list

            if (feeStudentSearchBox && studentSelect) {
                feeStudentSearchBox.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    studentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                    if (query.trim() === '') {
                        allStudents.forEach(s => {
                            const opt = document.createElement('option');
                            opt.value = s.id;
                            opt.textContent = `${s.full_name} (${s.class})`;
                            studentSelect.appendChild(opt);
                        });
                    } else {
                        const filtered = allStudents.filter(s => 
                            s.full_name.toLowerCase().includes(query) || (s.class && s.class.toLowerCase().includes(query))
                        );
                        if (filtered.length > 0) {
                            filtered.forEach(s => {
                                const opt = document.createElement('option');
                                opt.value = s.id;
                                opt.textContent = `${s.full_name} (${s.class})`;
                                studentSelect.appendChild(opt);
                            });
                        } else {
                            const opt = document.createElement('option');
                            opt.textContent = 'No matching students';
                            opt.disabled = true;
                            studentSelect.appendChild(opt);
                        }
                    }
                });
            }

            if (feeClearSearchBtn) {
                feeClearSearchBtn.onclick = () => {
                    feeStudentSearchBox.value = '';
                    studentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                    allStudents.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.textContent = `${s.full_name} (${s.class})`;
                        studentSelect.appendChild(opt);
                    });
                    studentSelect.value = '';
                };
            }

            // Search handlers for "Record Payment" student select
            const paymentStudentSearchBox = document.getElementById('paymentStudentSearchBox');
            const paymentClearSearchBtn = document.getElementById('paymentClearSearchBtn');
            const paymentStudent = document.getElementById('paymentStudent');
            const allStudentsPayment = students.slice(); // Keep original list

            if (paymentStudentSearchBox && paymentStudent) {
                paymentStudentSearchBox.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    paymentStudent.innerHTML = '<option value="">-- Select Student --</option>';
                    if (query.trim() === '') {
                        allStudentsPayment.forEach(s => {
                            const opt = document.createElement('option');
                            opt.value = s.id;
                            opt.textContent = s.full_name;
                            paymentStudent.appendChild(opt);
                        });
                    } else {
                        const filtered = allStudentsPayment.filter(s => 
                            s.full_name.toLowerCase().includes(query)
                        );
                        if (filtered.length > 0) {
                            filtered.forEach(s => {
                                const opt = document.createElement('option');
                                opt.value = s.id;
                                opt.textContent = s.full_name;
                                paymentStudent.appendChild(opt);
                            });
                        } else {
                            const opt = document.createElement('option');
                            opt.textContent = 'No matching students';
                            opt.disabled = true;
                            paymentStudent.appendChild(opt);
                        }
                    }
                });
            }

            if (paymentClearSearchBtn) {
                paymentClearSearchBtn.onclick = () => {
                    paymentStudentSearchBox.value = '';
                    paymentStudent.innerHTML = '<option value="">-- Select Student --</option>';
                    allStudentsPayment.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.textContent = s.full_name;
                        paymentStudent.appendChild(opt);
                    });
                    paymentStudent.value = '';
                };
            }

            // Attach create fee handler
            document.getElementById('createFeeBtn').onclick = () => {
                const student_id = document.getElementById('studentSelect').value;
                const total_due = document.getElementById('feeAmount').value;
                const due_date = document.getElementById('dueDate').value;
                const description = document.getElementById('feeDesc').value || 'School Fees';
                
                if (!student_id || !total_due) {
                    alert('Please select student and enter fee amount');
                    return;
                }
                
                try {
                    addFeeRecord({ student_id, total_due, due_date, description });
                    alert('✅ Fee record created! Notification sent to student.');
                    loadFeesManagement();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };
            
            document.getElementById('recordPaymentBtn').onclick = () => {
                const student_id = document.getElementById('paymentStudent').value;
                const amount_paid = document.getElementById('paymentAmount').value;
                const payment_date = document.getElementById('paymentDate').value;
                
                if (!student_id || !amount_paid) {
                    alert('Please select student and enter payment amount');
                    return;
                }
                
                try {
                    const result = addPayment({ student_id, amount_paid, payment_date });
                    alert(`✅ Payment recorded! Remaining balance: UGX ${result.remainingBalance.toFixed(2)}`);
                    showReceiptModal(result.paymentRecord);
                    loadFeesManagement();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };
            
            // Fee search handlers (inline)
            const feeSearchInput = document.getElementById('feeSearchQuery');
            const feeSearchBtn = document.getElementById('feeSearchBtn');
            const feeShowAllBtn = document.getElementById('feeShowAllBtn');

            const doFeeSearch = () => {
                const q = (feeSearchInput.value || '').trim().toLowerCase();
                if (!q) return renderFeesRows(getAllFees());
                const filtered = getAllFees().filter(f => {
                    return [f.student_name, f.description, f.due_date].some(v => v && v.toLowerCase().includes(q));
                });
                renderFeesRows(filtered);
            };

            feeSearchBtn.onclick = doFeeSearch;
            feeShowAllBtn.onclick = () => renderFeesRows(getAllFees());
            feeSearchInput.onkeyup = (e) => { if (e.key === 'Enter') doFeeSearch(); };
        }
        
        function loadPaymentHistory() {
            const container = document.getElementById('adminContent');
            const payments = getAllPayments();
            
            container.innerHTML = `
                <h2>📜 Payment History & Receipts</h2>
                <div style="overflow-x:auto; margin-top:1rem;">
                    <table>
                        <thead>
                            <tr><th>Receipt No.</th><th>Date</th><th>Student Name</th><th>Amount Paid</th><th>Remaining Balance</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            ${payments.map(p => `
                                <tr>
                                    <td>KFJS-${p.id}</td>
                                    <td>${p.date}</td>
                                    <td>${p.student_name}</td>
                                    <td>UGX ${p.amount.toFixed(2)}</td>
                                    <td>UGX ${p.remaining_balance.toFixed(2)}</td>
                                    <td><button class="viewReceiptBtn" data-id="${p.id}" style="background:var(--primary-green); width:auto;">🖨️ View Receipt</button></td>
                                </tr>
                            `).join('')}
                            ${payments.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No payments recorded yet</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            `;
            
            document.querySelectorAll('.viewReceiptBtn').forEach(btn => {
                btn.onclick = () => {
                    const paymentId = parseInt(btn.dataset.id);
                    const payment = payments.find(p => p.id === paymentId);
                    if (payment) showReceiptModal(payment);
                };
            });
        }

        function searchRecords(query) {
            const q = query.trim().toLowerCase();
            const db = getDB();
            if (!q) return { students: [], fees: [], payments: [] };
            const students = db.students.filter(s => {
                return [s.full_name, s.username, s.phone, s.class].some(value => value && value.toLowerCase().includes(q));
            });
            const fees = db.fees.filter(f => {
                return [f.student_name, f.description, f.due_date].some(value => value && value.toLowerCase().includes(q));
            });
            const payments = db.payments.filter(p => {
                return [p.student_name, p.date, `kfjs-${p.id}`].some(value => value && value.toLowerCase().includes(q));
            });
            return { students, fees, payments };
        }

        function renderSearchResults(query) {
            const results = searchRecords(query);
            const container = document.getElementById('searchResults');
            const totalMatches = results.students.length + results.fees.length + results.payments.length;
            
            container.innerHTML = `
                <div style="margin-bottom:1rem; font-size:0.95rem; color:#555;">
                    Found <strong>${totalMatches}</strong> result${totalMatches === 1 ? '' : 's'} for "${query.trim()}".
                </div>
                ${results.students.length > 0 ? `
                    <div style="margin-bottom:1.5rem;">
                        <h3>👩‍🎓 Students</h3>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Class</th><th>Username</th></tr></thead>
                                <tbody>
                                    ${results.students.map(s => `
                                        <tr>
                                            <td>${s.id}</td>
                                            <td>${s.full_name}</td>
                                            <td>${s.phone}</td>
                                            <td>${s.class || 'N/A'}</td>
                                            <td>${s.username}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                ` : ''}
                ${results.fees.length > 0 ? `
                    <div style="margin-bottom:1.5rem;">
                        <h3>💰 Fees</h3>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead><tr><th>Student</th><th>Description</th><th>Total Due</th><th>Paid</th><th>Balance</th><th>Due Date</th></tr></thead>
                                <tbody>
                                    ${results.fees.map(f => `
                                        <tr>
                                            <td>${f.student_name}</td>
                                            <td>${f.description}</td>
                                            <td>UGX ${f.total_due.toFixed(2)}</td>
                                            <td>UGX ${f.paid_amount.toFixed(2)}</td>
                                            <td>UGX ${(f.total_due - f.paid_amount).toFixed(2)}</td>
                                            <td>${f.due_date || 'Not set'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                ` : ''}
                ${results.payments.length > 0 ? `
                    <div style="margin-bottom:1.5rem;">
                        <h3>📜 Payments</h3>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead><tr><th>Receipt</th><th>Date</th><th>Student</th><th>Amount Paid</th><th>Remaining Balance</th></tr></thead>
                                <tbody>
                                    ${results.payments.map(p => `
                                        <tr>
                                            <td>KFJS-${p.id}</td>
                                            <td>${p.date}</td>
                                            <td>${p.student_name}</td>
                                            <td>UGX ${p.amount.toFixed(2)}</td>
                                            <td>UGX ${p.remaining_balance.toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                ` : ''}
                ${totalMatches === 0 ? `<div class="alert alert-error">No results found. Try a different name, ID, description or date.</div>` : ''}
            `;
        }

        function loadSearchManagement() {
            const container = document.getElementById('adminContent');
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem;">
                    <h2>🔎 Search Records</h2>
                    <div style="flex:1; min-width:280px; display:flex; gap:0.75rem; align-items:center;">
                        <input type="search" id="searchQuery" placeholder="Search students, fees, payments..." autocomplete="off">
                        <button id="searchBtn" style="width:auto; padding:10px 24px;">Search</button>
                    </div>
                </div>
                <div id="searchResults">
                    <div class="alert alert-success">Type a name, class, fee description, receipt number, or date to begin searching.</div>
                </div>
            `;

            const searchInput = document.getElementById('searchQuery');
            const searchBtn = document.getElementById('searchBtn');
            const doSearch = () => {
                const query = searchInput.value;
                renderSearchResults(query);
            };
            searchBtn.onclick = doSearch;
            searchInput.onkeyup = (event) => {
                if (event.key === 'Enter') doSearch();
            };
        }

        function renderStudentDashboard() {
            const studentId = currentUser.id;
            const fees = getStudentFees(studentId);
            const totalBalance = fees.reduce((sum, f) => sum + (f.total_due - f.paid_amount), 0);
            
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="nav-bar">
                        <div class="nav-brand">📘 King Fahad Junior School - Student Portal</div>
                        <div class="nav-links">
                            <button class="nav-link" id="logoutBtn">🚪 Logout</button>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                            <div>
                                <h2>Welcome, ${currentUser.full_name} 🎓</h2>
                                <p style="margin:5px 0;">Class: ${currentUser.class || 'Not Assigned'} | Phone: ${currentUser.phone}</p>
                            </div>
                            <div class="stat-card" style="background:${totalBalance > 0 ? '#fff3e0' : '#e8f5e9'}; min-width:200px;">
                                <h3 style="margin:0;">Total Outstanding</h3>
                                <p style="font-size:2rem; font-weight:bold; color:${totalBalance > 0 ? '#d32f2f' : '#2e7d32'};">UGX ${totalBalance.toFixed(2)}</p>
                            </div>
                        </div>
                        
                        <h3 style="margin-top:2rem;">📋 My Fee Statement</h3>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead>
                                    <tr><th>Description</th><th>Total Due (UGX)</th><th>Paid (UGX)</th><th>Balance</th><th>Due Date</th></tr>
                                </thead>
                                <tbody>
                                    ${fees.map(f => `
                                        <tr>
                                            <td>${f.description}</td>
                                            <td>${f.total_due.toFixed(2)}</td>
                                            <td>${f.paid_amount.toFixed(2)}</td>
                                            <td style="color:${(f.total_due - f.paid_amount) > 0 ? '#d32f2f' : '#2e7d32'}; font-weight:bold;">${(f.total_due - f.paid_amount).toFixed(2)}</td>
                                            <td>${f.due_date || 'Not set'}</td>
                                        </tr>
                                    `).join('')}
                                    ${fees.length === 0 ? '<tr><td colspan="5" style="text-align:center;">No fee records found</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                        <div class="alert alert-success" style="margin-top:20px;">
                            💡 <strong>Note:</strong> All fee notifications are automatically sent to your registered phone number when new fees are assigned or payments are recorded.
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('logoutBtn').onclick = () => {
                currentUser = null;
                renderLogin();
            };
        }
        
        // Initialize and start app
        initDatabase();
        renderLogin();
    </script>
</body>
</html>
