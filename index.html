<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>King Fahad Junior School - SMS | Complete School Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2e0 0%, #c8e6c9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Green & White Theme */
        :root {
            --primary-green: #2e7d32;
            --primary-dark: #1b5e20;
            --light-green: #81c784;
            --accent-green: #4caf50;
            --white: #ffffff;
            --gray-bg: #f8faf8;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
            --border-radius: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 2rem;
        }

        .card-login {
            max-width: 450px;
            margin: 80px auto;
        }

        h1, h2, h3 {
            color: var(--primary-green);
            font-weight: 600;
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            font-size: 1.8rem;
            letter-spacing: -0.3px;
        }

        .logo .sub {
            color: #5a6b5a;
            font-size: 0.9rem;
        }

        input, select, button {
            width: 100%;
            padding: 12px 18px;
            margin: 8px 0;
            border: 2px solid #e0e7e0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--white);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        button {
            background: var(--primary-green);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--accent-green);
        }

        .btn-danger {
            background: #d32f2f;
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
        }

        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            padding: 1rem 2rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary-green);
        }

        .nav-links {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-link {
            background: none;
            border: none;
            color: var(--primary-green);
            font-weight: 500;
            cursor: pointer;
            width: auto;
            padding: 8px 20px;
            margin: 0;
            border-radius: 40px;
        }

        .nav-link:hover {
            background: #e8f5e9;
            transform: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e8ece8;
        }

        th {
            background: var(--primary-green);
            color: white;
            font-weight: 500;
        }

        tr:hover {
            background: #f5f9f5;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            margin: 1.5rem 0;
        }

        .stat-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
            border-top: 5px solid var(--primary-green);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-danger {
            background: #ffebee;
            color: #c62828;
        }

        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        @media (max-width: 768px) {
            .card, .card-login {
                padding: 1.2rem;
            }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
            }
            th, td {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ==================== MOCK DATABASE (LocalStorage) ====================
        // Initialize database if not exists
        function initDatabase() {
            if (!localStorage.getItem('school_db')) {
                const defaultData = {
                    users: [
                        { id: 1, username: 'admin', password: 'admin123', full_name: 'Administrator', phone_number: '055-123-4567', role: 'admin', class: null },
                        { id: 2, username: 'student1', password: 'student123', full_name: 'Ahmed Hassan', phone_number: '055-111-1111', role: 'student', class: 'Grade 5A' },
                        { id: 3, username: 'student2', password: 'student123', full_name: 'Fatima Ibrahim', phone_number: '055-222-2222', role: 'student', class: 'Grade 6B' },
                        { id: 4, username: 'student3', password: 'student123', full_name: 'Omar Khalid', phone_number: '055-333-3333', role: 'student', class: 'Grade 4C' }
                    ],
                    students: [
                        { id: 2, full_name: 'Ahmed Hassan', phone_number: '055-111-1111', class: 'Grade 5A', username: 'student1', password: 'student123', role: 'student' },
                        { id: 3, full_name: 'Fatima Ibrahim', phone_number: '055-222-2222', class: 'Grade 6B', username: 'student2', password: 'student123', role: 'student' },
                        { id: 4, full_name: 'Omar Khalid', phone_number: '055-333-3333', class: 'Grade 4C', username: 'student3', password: 'student123', role: 'student' }
                    ],
                    fees: [
                        { id: 1, student_id: 2, student_name: 'Ahmed Hassan', description: 'Term 1 Fees 2025', total_due: 2500, paid_amount: 1000, due_date: '2025-04-15' },
                        { id: 2, student_id: 3, student_name: 'Fatima Ibrahim', description: 'Term 1 Fees 2025', total_due: 2500, paid_amount: 2500, due_date: '2025-04-15' },
                        { id: 3, student_id: 4, student_name: 'Omar Khalid', description: 'Term 1 Fees 2025', total_due: 2500, paid_amount: 500, due_date: '2025-04-15' }
                    ],
                    nextUserId: 5,
                    nextFeeId: 4
                };
                localStorage.setItem('school_db', JSON.stringify(defaultData));
            }
        }

        function getDB() {
            return JSON.parse(localStorage.getItem('school_db'));
        }

        function saveDB(db) {
            localStorage.setItem('school_db', JSON.stringify(db));
        }

        // Helper to send SMS notification (simulated with alert + console)
        function sendSMSNotification(to, subject, message) {
            console.log(`📱 SMS TO: ${to}`);
            console.log(`Subject: ${subject}`);
            console.log(`Message: ${message}`);
            // In real system, this would be an API call
            alert(`📱 SMS sent to ${to}\nSubject: ${subject}\n\n${message}`);
            return true;
        }

        // Check for fee due balances and send notifications
        function checkAndNotifyDueFees() {
            const db = getDB();
            const notificationsSent = [];
            for (const fee of db.fees) {
                const balance = fee.total_due - fee.paid_amount;
                if (balance > 0) {
                    const student = db.students.find(s => s.id === fee.student_id);
                    if (student && student.phone_number) {
                        const subject = `⚠️ Fee Due Reminder - King Fahad Junior School`;
                        const message = `Dear ${student.full_name},\n\nYour outstanding balance for "${fee.description}" is GHS ${balance.toFixed(2)}.\nDue Date: ${fee.due_date || 'Immediately'}\nPlease clear your dues to avoid penalties.\n\nRegards,\nKing Fahad Junior School Admin`;
                        sendSMSNotification(student.phone_number, subject, message);
                        notificationsSent.push(student.phone_number);
                    }
                }
            }
            return notificationsSent;
        }

        // Authentication
        function login(username, password) {
            const db = getDB();
            const user = db.users.find(u => u.username === username && u.password === password);
            if (user) {
                const { password: _, ...userWithoutPass } = user;
                return { success: true, user: userWithoutPass };
            }
            return { success: false, error: 'Invalid username or password' };
        }

        // Student CRUD
        function getAllStudents() {
            const db = getDB();
            return db.students;
        }

        function addStudent(studentData) {
            const db = getDB();
            const newId = db.nextUserId;
            const newStudent = {
                id: newId,
                full_name: studentData.full_name,
                phone_number: studentData.phone_number,
                class: studentData.class,
                username: studentData.username,
                password: studentData.password,
                role: 'student'
            };
            db.students.push(newStudent);
            db.users.push({ ...newStudent, id: newId });
            db.nextUserId++;
            saveDB(db);
            return newStudent;
        }

        function deleteStudent(studentId) {
            const db = getDB();
            const studentIndex = db.students.findIndex(s => s.id === parseInt(studentId));
            if (studentIndex !== -1) {
                const student = db.students[studentIndex];
                db.students.splice(studentIndex, 1);
                const userIndex = db.users.findIndex(u => u.id === parseInt(studentId));
                if (userIndex !== -1) db.users.splice(userIndex, 1);
                // Delete associated fees
                db.fees = db.fees.filter(f => f.student_id !== parseInt(studentId));
                saveDB(db);
                return true;
            }
            return false;
        }

        // Fee Management
        function getAllFees() {
            const db = getDB();
            return db.fees.map(fee => ({
                ...fee,
                balance: fee.total_due - fee.paid_amount
            }));
        }

        function addFeeRecord(feeData) {
            const db = getDB();
            const student = db.students.find(s => s.id === parseInt(feeData.student_id));
            if (!student) throw new Error('Student not found');
            
            const newFee = {
                id: db.nextFeeId,
                student_id: parseInt(feeData.student_id),
                student_name: student.full_name,
                description: feeData.description || 'School Fees',
                total_due: parseFloat(feeData.total_due),
                paid_amount: 0,
                due_date: feeData.due_date || null
            };
            db.fees.push(newFee);
            db.nextFeeId++;
            saveDB(db);
            
            // Send notification for new fee
            const balance = newFee.total_due;
            if (balance > 0 && student.phone_number) {
                sendSMSNotification(student.phone_number, 'New Fee Assigned', 
                    `Dear ${student.full_name},\n\nA new fee of GHS ${balance} has been assigned: ${newFee.description}\nDue Date: ${newFee.due_date || 'Soon'}\n\nPlease ensure timely payment.\n\nRegards,\nAdmin`);
            }
            return newFee;
        }

        function addPayment(paymentData) {
            const db = getDB();
            const studentId = parseInt(paymentData.student_id);
            const amountPaid = parseFloat(paymentData.amount_paid);
            
            // Find unpaid fees first (fees with balance > 0)
            const unpaidFees = db.fees.filter(f => f.student_id === studentId && (f.total_due - f.paid_amount) > 0);
            if (unpaidFees.length === 0) {
                throw new Error('No outstanding fees for this student');
            }
            
            let remaining = amountPaid;
            const paymentRecords = [];
            
            for (let fee of unpaidFees) {
                const balance = fee.total_due - fee.paid_amount;
                if (remaining <= 0) break;
                
                const paymentToThisFee = Math.min(remaining, balance);
                fee.paid_amount += paymentToThisFee;
                remaining -= paymentToThisFee;
                paymentRecords.push({ feeId: fee.id, amount: paymentToThisFee });
            }
            
            saveDB(db);
            
            // Send notification about payment and remaining balance
            const student = db.students.find(s => s.id === studentId);
            if (student && student.phone_number) {
                const totalRemaining = db.fees.filter(f => f.student_id === studentId).reduce((sum, f) => sum + (f.total_due - f.paid_amount), 0);
                sendSMSNotification(student.phone_number, 'Payment Received', 
                    `Dear ${student.full_name},\n\nWe have received your payment of GHS ${amountPaid}.\nRemaining balance: GHS ${totalRemaining.toFixed(2)}\n\nThank you for your prompt payment!\n\nRegards,\nKing Fahad Junior School`);
            }
            
            return { success: true, paymentRecords, remainingBalance: remaining };
        }

        function deleteFeeRecord(feeId) {
            const db = getDB();
            const index = db.fees.findIndex(f => f.id === parseInt(feeId));
            if (index !== -1) {
                db.fees.splice(index, 1);
                saveDB(db);
                return true;
            }
            return false;
        }

        function getStudentFees(studentId) {
            const db = getDB();
            return db.fees.filter(f => f.student_id === parseInt(studentId)).map(f => ({
                ...f,
                balance: f.total_due - f.paid_amount
            }));
        }

        // ==================== UI RENDERING ====================
        let currentUser = null;

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="card card-login">
                        <div class="logo">
                            <img src="logo.png" alt="King Fahad Junior School Logo" style="width: 80px; height: 80px; margin-bottom: 10px; border-radius: 50%;">
                            <h1>KING FAHAD JUNIOR SCHOOL</h1>
                            <div class="sub">Excellence in Education | Online Management System</div>
                        </div>
                        <h2 style="text-align:center; font-size:1.4rem;">Secure Login Portal</h2>
                        <div id="loginError" class="alert alert-error" style="display:none"></div>
                        <input type="text" id="username" placeholder="Username" autocomplete="off">
                        <input type="password" id="password" placeholder="Password">
                        <button id="loginBtn">🔐 Login to Dashboard</button>
                    </div>
                </div>
            `;
            
            document.getElementById('loginBtn').onclick = () => {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('loginError');
                
                const result = login(username, password);
                if (result.success) {
                    currentUser = result.user;
                    if (currentUser.role === 'admin') {
                        renderAdminDashboard();
                    } else {
                        renderStudentDashboard();
                    }
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = result.error;
                }
            };
        }

        function renderAdminDashboard() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="nav-bar">
                        <div class="nav-brand">🏫 KING FAHAD JUNIOR SCHOOL - ADMIN PANEL</div>
                        <div class="nav-links">
                            <button class="nav-link" id="navStudents">👥 Students Management</button>
                            <button class="nav-link" id="navFees">💰 Fee Management</button>
                            <button class="nav-link" id="navNotify">📧 Send Due Reminders</button>
                            <button class="nav-link" id="logoutBtn">🚪 Logout</button>
                        </div>
                    </div>
                    <div id="adminContent"></div>
                </div>
            `;
            
            document.getElementById('logoutBtn').onclick = () => {
                currentUser = null;
                renderLogin();
            };
            document.getElementById('navStudents').onclick = () => loadStudentsManagement();
            document.getElementById('navFees').onclick = () => loadFeesManagement();
            document.getElementById('navNotify').onclick = () => {
                const sent = checkAndNotifyDueFees();
                alert(`✅ Notifications sent to ${sent.length} student(s) with due balances.`);
                loadFeesManagement();
            };
            
            loadStudentsManagement();
        }
        
        function loadStudentsManagement() {
            const container = document.getElementById('adminContent');
            const students = getAllStudents();
            
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem;">
                    <h2>👩‍🎓 Student Records</h2>
                    <button id="addStudentBtn" style="width:auto; padding:10px 28px;">➕ Add New Student</button>
                </div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Full Name</th><th>Phone Number</th><th>Class</th><th>Username</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            ${students.map(s => `
                                <tr>
                                    <td>${s.id}</td>
                                    <td><strong>${s.full_name}</strong></td>
                                    <td>${s.phone_number}</td>
                                    <td>${s.class || 'N/A'}</td>
                                    <td>${s.username}</td>
                                    <td><button class="deleteStudentBtn" data-id="${s.id}" style="background:#d32f2f; width:auto; padding:6px 16px;">Delete</button></td>
                                </tr>
                            `).join('')}
                            ${students.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No students found</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            `;
            
            document.getElementById('addStudentBtn').onclick = () => {
                const full_name = prompt('Full Name:');
                if (!full_name) return;
                const phone_number = prompt('Phone Number:');
                if (!phone_number) return;
                const className = prompt('Class (e.g., Grade 5A):') || 'Not Assigned';
                const username = prompt('Username (unique):');
                if (!username) return;
                const password = prompt('Password:') || 'student123';
                
                try {
                    addStudent({ full_name, phone_number, class: className, username, password });
                    alert('✅ Student added successfully! They can now login.');
                    loadStudentsManagement();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };
            
            document.querySelectorAll('.deleteStudentBtn').forEach(btn => {
                btn.onclick = () => {
                    if (confirm('⚠️ Delete this student? All fee records will be permanently removed.')) {
                        deleteStudent(btn.dataset.id);
                        alert('Student deleted');
                        loadStudentsManagement();
                    }
                };
            });
        }
        
        function loadFeesManagement() {
            const container = document.getElementById('adminContent');
            const students = getAllStudents();
            const fees = getAllFees();
            
            container.innerHTML = `
                <h2>💰 Fee Management System</h2>
                <div class="grid-2">
                    <div class="stat-card">
                        <h3>📝 Assign New Fee</h3>
                        <select id="studentSelect">
                            <option value="">-- Select Student --</option>
                            ${students.map(s => `<option value="${s.id}">${s.full_name} (${s.class})</option>`).join('')}
                        </select>
                        <input type="number" id="feeAmount" placeholder="Total Amount (GHS)" step="0.01">
                        <input type="date" id="dueDate">
                        <input type="text" id="feeDesc" placeholder="Description (e.g., Term 2 Fees)">
                        <button id="createFeeBtn">➕ Create Fee Record</button>
                    </div>
                    <div class="stat-card">
                        <h3>💵 Record Payment</h3>
                        <select id="paymentStudent">
                            <option value="">-- Select Student --</option>
                            ${students.map(s => `<option value="${s.id}">${s.full_name}</option>`).join('')}
                        </select>
                        <input type="number" id="paymentAmount" placeholder="Amount Paid (GHS)" step="0.01">
                        <input type="date" id="paymentDate" value="${new Date().toISOString().slice(0,10)}">
                        <button id="recordPaymentBtn">💸 Record Payment</button>
                    </div>
                </div>
                <h3>📋 All Fee Records</h3>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr><th>Student</th><th>Description</th><th>Total Due</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            ${fees.map(f => `
                                <tr>
                                    <td><strong>${f.student_name}</strong></td>
                                    <td>${f.description}</td>
                                    <td>GHS ${f.total_due.toFixed(2)}</td>
                                    <td>GHS ${f.paid_amount.toFixed(2)}</td>
                                    <td class="${(f.total_due - f.paid_amount) > 0 ? 'badge-danger' : 'badge-success'}" style="font-weight:bold;">GHS ${(f.total_due - f.paid_amount).toFixed(2)}</td>
                                    <td>${f.due_date || 'Not set'}</td>
                                    <td><button class="deleteFeeBtn" data-id="${f.id}" style="background:#d32f2f; width:auto; padding:5px 12px;">Delete</button></td>
                                </tr>
                            `).join('')}
                            ${fees.length === 0 ? '<tr><td colspan="7" style="text-align:center;">No fee records found</td></tr>' : ''}
                        </tbody>
                    </table>
                </div>
            `;
            
            document.getElementById('createFeeBtn').onclick = () => {
                const student_id = document.getElementById('studentSelect').value;
                const total_due = document.getElementById('feeAmount').value;
                const due_date = document.getElementById('dueDate').value;
                const description = document.getElementById('feeDesc').value || 'School Fees';
                
                if (!student_id || !total_due) {
                    alert('Please select student and enter fee amount');
                    return;
                }
                
                try {
                    addFeeRecord({ student_id, total_due, due_date, description });
                    alert('✅ Fee record created! Notification sent to student.');
                    loadFeesManagement();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };
            
            document.getElementById('recordPaymentBtn').onclick = () => {
                const student_id = document.getElementById('paymentStudent').value;
                const amount_paid = document.getElementById('paymentAmount').value;
                const payment_date = document.getElementById('paymentDate').value;
                
                if (!student_id || !amount_paid) {
                    alert('Please select student and enter payment amount');
                    return;
                }
                
                try {
                    addPayment({ student_id, amount_paid, payment_date });
                    alert('✅ Payment recorded! Updated balance and notification sent.');
                    loadFeesManagement();
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            };
            
            document.querySelectorAll('.deleteFeeBtn').forEach(btn => {
                btn.onclick = () => {
                    if (confirm('Delete this fee record?')) {
                        deleteFeeRecord(btn.dataset.id);
                        alert('Fee record deleted');
                        loadFeesManagement();
                    }
                };
            });
        }
        
        function renderStudentDashboard() {
            const studentId = currentUser.id;
            const fees = getStudentFees(studentId);
            const totalBalance = fees.reduce((sum, f) => sum + (f.total_due - f.paid_amount), 0);
            
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="nav-bar">
                        <div class="nav-brand">📘 King Fahad Junior School - Student Portal</div>
                        <div class="nav-links">
                            <button class="nav-link" id="logoutBtn">🚪 Logout</button>
                        </div>
                    </div>
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                            <div>
                                <h2>Welcome, ${currentUser.full_name} 🎓</h2>
                                <p style="margin:5px 0;">Class: ${currentUser.class || 'Not Assigned'} | Phone: ${currentUser.phone_number}</p>
                            </div>
                            <div class="stat-card" style="background:${totalBalance > 0 ? '#fff3e0' : '#e8f5e9'}; min-width:200px;">
                                <h3 style="margin:0;">Total Outstanding</h3>
                                <p style="font-size:2rem; font-weight:bold; color:${totalBalance > 0 ? '#d32f2f' : '#2e7d32'};">GHS ${totalBalance.toFixed(2)}</p>
                            </div>
                        </div>
                        
                        <h3 style="margin-top:2rem;">📋 My Fee Statement</h3>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead>
                                    <tr><th>Description</th><th>Total Due (GHS)</th><th>Paid (GHS)</th><th>Balance</th><th>Due Date</th></tr>
                                </thead>
                                <tbody>
                                    ${fees.map(f => `
                                        <tr>
                                            <td>${f.description}</td>
                                            <td>${f.total_due.toFixed(2)}</td>
                                            <td>${f.paid_amount.toFixed(2)}</td>
                                            <td style="color:${(f.total_due - f.paid_amount) > 0 ? '#d32f2f' : '#2e7d32'}; font-weight:bold;">${(f.total_due - f.paid_amount).toFixed(2)}</td>
                                            <td>${f.due_date || 'Not set'}</td>
                                        </tr>
                                    `).join('')}
                                    ${fees.length === 0 ? '<tr><td colspan="5" style="text-align:center;">No fee records found</td></tr>' : ''}
                                </tbody>
                            </table>
                        </div>
                        <div class="alert alert-success" style="margin-top:20px;">
                            💡 <strong>Note:</strong> All fee notifications are automatically sent to your registered phone number when new fees are assigned or payments are recorded.
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('logoutBtn').onclick = () => {
                currentUser = null;
                renderLogin();
            };
        }
        
        // Initialize and start app
        initDatabase();
        renderLogin();
    </script>
</body>
</html>
